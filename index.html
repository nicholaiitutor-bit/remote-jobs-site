<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Work Hub PH</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      color: #14a800;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    nav a:hover {
      color: #14a800;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 40px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #222;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .hero input {
      width: 60%;
      max-width: 500px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      margin-top: 10px;
      background: #14a800;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn.secondary {
      background: #28a745;
    }

    .jobs {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .job-card {
      background: #fff;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .job-card h3 {
      margin: 0;
      font-size: 16px;
      color: #14a800;
    }

    .job-card p {
      font-size: 13px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>

  <!-- Dynamic Navbar -->
  <nav id="navbar"></nav>
</header>

<section class="hero">

  <h1>Find Trusted Remote Jobs in the Philippines</h1>

  <p>
    Work from home opportunities for Filipino freelancers
  </p>

  <input
    type="text"
    placeholder="Search jobs..."
    onkeyup="goSearch(this.value)"
  >

  <br>

  <a href="jobs.html" class="btn">
    Browse Jobs
  </a>

  <a href="post-job.html" class="btn secondary">
    Post a Job
  </a>

</section>

<section class="jobs">

  <h2 style="text-align:center;">
    Featured Jobs
  </h2>

  <div id="featuredJobs">
    Loading jobs...
  </div>

</section>

<footer>
  © 2026 Remote Work Hub PH
</footer>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container =
  document.getElementById("featuredJobs");

async function loadJobs() {

  try {

    const snap =
      await getDocs(collection(db, "jobs"));

    let html = "";
    let count = 0;

    snap.forEach((doc) => {

      if (count < 3) {

        const job = doc.data();

        html += `
          <div class="job-card">

            <h3>
              ${job.title || "Untitled Job"}
            </h3>

            <p>
              <b>${job.type || ""}</b>
              •
              ${job.rate || ""}
            </p>

            <p>
              ${(job.description || "")
                .substring(0, 100)}
            </p>

            <a
              href="job-details.html?id=${doc.id}"
              class="btn"
            >
              View Job
            </a>

          </div>
        `;

        count++;

      }

    });

    if (html === "") {
      html = "<p>No jobs available yet.</p>";
    }

    container.innerHTML = html;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<p>Unable to load jobs.</p>";

  }

}

loadJobs();

window.goSearch = function(value) {

  if (value.length > 2) {

    window.location.href =
      "jobs.html";

  }

};

</script>

<!-- Dynamic Navbar -->
<script type="module" src="navbar.js"></script>

</body>
</html>
