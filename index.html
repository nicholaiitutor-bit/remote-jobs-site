<!DOCTYPE html>
<html>
<head>
  <title>Online Jobs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Online Jobs</h2>
  <nav id="navbar"></nav>
</header>

<section class="hero">
  <h1>Find Remote Jobs</h1>
  <p>Work from home opportunities worldwide</p>
</section>

<main class="jobs">
  <div id="jobList"></div>
</main>

<script type="module">
import { initAuth, currentUser, logout } from "./auth.js";

const navbar = document.getElementById("navbar");

initAuth(() => {

  if (!currentUser) {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    `;
  } else if (currentUser.role === "employer") {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="post-job.html">Post Job</a>
      <a href="employer-dashboard.html">Dashboard</a>
      <a href="#" id="logout">Logout</a>
    `;
  } else {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="#" id="logout">Logout</a>
    `;
  }

  const btn = document.getElementById("logout");
  if (btn) btn.onclick = async () => {
    await logout();
    location.reload();
  };
});
</script>

</body>
</html>
