<!DOCTYPE html>
<html>
<head>
  <title>WorkMarket</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2 class="logo">WorkMarket</h2>
  <nav id="navbar"></nav>
</header>

<section class="hero">
  <h1>Find Remote Jobs Fast</h1>
  <p>OLJ PH style marketplace for freelancers</p>

  <div class="search-box">
    <input id="searchInput" placeholder="Search jobs...">
  </div>
</section>

<main class="jobs" id="jobList"></main>

<script type="module">
import { loadNavbar } from "./navbar.js";
loadNavbar();
</script>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const jobList = document.getElementById("jobList");
let jobs = [];

async function loadJobs() {
  const snap = await getDocs(collection(db, "jobs"));

  jobs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  render(jobs);
}

function render(list) {
  jobList.innerHTML = "";

  list.forEach(j => {
    jobList.innerHTML += `
      <div class="job-card">
        <h3>${j.title}</h3>
        <div class="job-meta">
          ${j.company || "Private"} • ${j.location || "Remote"}
        </div>
        <p>${(j.description || "").slice(0, 100)}...</p>
        <a class="btn" href="job.html?id=${j.id}">View Job</a>
      </div>
    `;
  });
}

// SEARCH
document.addEventListener("input", (e) => {
  if (e.target.id === "searchInput") {
    const val = e.target.value.toLowerCase();
    render(jobs.filter(j => j.title?.toLowerCase().includes(val)));
  }
});

loadJobs();
</script>

</body>
</html>
