<!DOCTYPE html>
<html>
<head>
  <title>Jobs Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>WorkMarket</h2>
  <nav id="navbar"></nav>
</header>

<section class="hero">
  <h1>Find Top Freelance & Remote Jobs</h1>
  <p>Hire talent or get hired instantly</p>

  <div class="search-box">
    <input id="searchInput" placeholder="Search jobs (designer, VA, developer...)">
  </div>
</section>

<main class="jobs" id="jobList"></main>

<!-- NAV AUTH -->
<script type="module">
import { initAuth, currentUser, logout } from "./auth.js";

const navbar = document.getElementById("navbar");

initAuth(() => {

  if (!currentUser) {
    navbar.innerHTML = `
      <a href="index.html">Find Jobs</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    `;
  } else if (currentUser.role === "employer") {
    navbar.innerHTML = `
      <a href="index.html">Find Talent</a>
      <a href="post-job.html">Post Job</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#" id="logout">Logout</a>
    `;
  } else {
    navbar.innerHTML = `
      <a href="index.html">Jobs</a>
      <a href="dashboard.html">My Applications</a>
      <a href="#" id="logout">Logout</a>
    `;
  }

  document.getElementById("logout")?.addEventListener("click", async () => {
    await logout();
    location.reload();
  });
});
</script>

<!-- FIREBASE JOB FEED -->
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const jobList = document.getElementById("jobList");

async function loadJobs() {
  const snap = await getDocs(collection(db, "jobs"));

  jobList.innerHTML = "";

  snap.forEach(doc => {
    const j = doc.data();

    jobList.innerHTML += `
      <div class="job-card">
        <h3>${j.title}</h3>
        <div class="job-meta">
          ${j.company || "Private"} • ${j.location || "Remote"} • ${j.type || "Full-time"}
        </div>
        <p>${(j.description || "").slice(0, 90)}...</p>
        <a class="btn" href="job.html?id=${doc.id}">View Job</a>
      </div>
    `;
  });
}

loadJobs();
</script>

</body>
</html>
