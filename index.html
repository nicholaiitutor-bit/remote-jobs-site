<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Work Hub PH</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
    }

    /* HEADER (OLJ STYLE) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
      color: #14a800;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    nav a:hover {
      color: #14a800;
    }

    /* HERO (OLJ STYLE CENTERED) */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #222;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .hero input {
      width: 60%;
      max-width: 500px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      padding: 10px 14px;
      margin-top: 10px;
      background: #14a800;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn.secondary {
      background: #28a745;
    }

    /* JOB SECTION */
    .jobs {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .job-card {
      background: #fff;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .job-card h3 {
      margin: 0;
      font-size: 16px;
      color: #14a800;
    }

    .job-card p {
      font-size: 13px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <h2>Remote Work Hub PH</h2>

  <nav id="navbar">
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Find Trusted Remote Jobs in the Philippines</h1>
  <p>Work from home opportunities for Filipino freelancers</p>

  <input type="text" placeholder="Search jobs..." onkeyup="goSearch(this.value)">

  <br>

  <a href="jobs.html" class="btn">Browse Jobs</a>
  <a href="post-job.html" class="btn secondary">Post a Job</a>
</section>

<!-- FEATURED JOBS -->
<section class="jobs">
  <h2 style="text-align:center;">Featured Jobs</h2>
  <div id="featuredJobs">Loading jobs...</div>
</section>

<footer>
  © 2026 Remote Work Hub PH
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAs5VqodQCgH-F-VYbM1zS2BzsoHOQGpzo",
  authDomain: "remote-work-hub-211d8.firebaseapp.com",
  projectId: "remote-work-hub-211d8",
  storageBucket: "remote-work-hub-211d8.firebasestorage.app",
  messagingSenderId: "697750475671",
  appId: "1:697750475671:web:6e609411ae003e6500aad2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("featuredJobs");

async function loadJobs() {
  const snap = await getDocs(collection(db, "jobs"));

  let html = "";
  let count = 0;

  snap.forEach(doc => {
    if (count < 3) {
      const job = doc.data();

      html += `
        <div class="job-card">
          <h3>${job.title || "No title"}</h3>
          <p><b>${job.type || ""}</b> • ${job.rate || ""}</p>
          <p>${(job.description || "").substring(0, 80)}...</p>
          <a href="job.html?id=${doc.id}" class="btn">View Job</a>
        </div>
      `;

      count++;
    }
  });

  container.innerHTML = html || "<p>No jobs yet.</p>";
}

loadJobs();

/* SEARCH */
window.goSearch = function(val) {
  if (val.length > 2) {
    window.location.href = "jobs.html";
  }
};
</script>

</body>
</html>
