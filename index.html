<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Jobs</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- HEADER (this fixes your styling issue) -->
<header>
  <h2>Online Jobs</h2>
  <nav id="navbar"></nav>
</header>

<!-- HERO SECTION -->
<section class="hero">
  <h1>Find Remote Jobs Easily</h1>
  <p>Connect with employers and start working from home</p>
</section>

<!-- MAIN CONTENT -->
<main class="jobs">
  <h2>Latest Jobs</h2>
  <div id="jobList"></div>
</main>

<!-- YOUR AUTH NAV SCRIPT -->
<script type="module">
import { initAuth, currentUser, logout } from "./auth.js";

const navbar = document.getElementById("navbar");

initAuth(() => {

  if (!currentUser) {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    `;
  } 
  else if (currentUser.role === "employer") {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="post-job.html">Post Job</a>
      <a href="employer-dashboard.html">Dashboard</a>
      <a href="#" id="logout">Logout</a>
    `;
  } 
  else {
    navbar.innerHTML = `
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="#" id="logout">Logout</a>
    `;
  }

  const btn = document.getElementById("logout");
  if (btn) {
    btn.onclick = async () => {
      await logout();
      location.reload();
    };
  }
});
</script>

</body>
</html>
