<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>

  <nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="post-job.html">Post Job</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">

  <h1>Find Trusted Remote Jobs in the Philippines</h1>
  <p>Connect with global employers and start working from home today</p>

  <div style="margin-top:20px;">
    <a href="jobs.html" class="btn">Browse Jobs</a>
    <a href="post-job.html" class="btn" style="background:#28a745;">Post a Job</a>
  </div>

  <!-- SEARCH -->
  <div style="margin-top:25px;">
    <input 
      type="text" 
      placeholder="Search remote jobs..." 
      style="padding:12px; width:60%; border-radius:6px; border:1px solid #ccc;"
      onkeyup="goSearch(this.value)"
    >
  </div>

</section>

<!-- STATS -->
<section style="display:flex; justify-content:center; gap:40px; padding:20px; background:white; text-align:center;">

  <div>
    <h3>10,000+</h3>
    <p>Remote Jobs</p>
  </div>

  <div>
    <h3>5,000+</h3>
    <p>Employers</p>
  </div>

  <div>
    <h3>100% Free</h3>
    <p>For Freelancers</p>
  </div>

</section>

<!-- FEATURED JOBS -->
<section class="jobs">

  <h2 style="text-align:center;">Featured Jobs</h2>

  <div id="featuredJobs" style="max-width:900px; margin:auto;"></div>

</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 Remote Work Hub PH</p>
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (REPLACE THIS) */
const firebaseConfig = {
  apiKey: "AIzaSyAs5VqodQCgH-F-VYbM1zS2BzsoHOQGpzo",
  authDomain: "remote-work-hub-211d8.firebaseapp.com",
  projectId: "remote-work-hub-211d8",
  storageBucket: "remote-work-hub-211d8.firebasestorage.app",
  messagingSenderId: "697750475671",
  appId: "1:697750475671:web:6e609411ae003e6500aad2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD FEATURED JOBS */
async function loadFeaturedJobs() {
  const snapshot = await getDocs(collection(db, "jobs"));

  let html = "";
  let count = 0;

  snapshot.forEach((doc) => {
    if (count < 3) {
      let job = doc.data();

      html += `
        <div class="job-card">
          <h3>${job.title}</h3>
          <p><b>${job.type}</b> • ${job.rate}</p>
          <p>${job.desc ? job.desc.substring(0, 90) : ""}...</p>
          <a href="jobs.html" class="btn">View Jobs</a>
        </div>
      `;

      count++;
    }
  });

  if (count === 0) {
    html = "<p style='text-align:center;'>No jobs available yet.</p>";
  }

  document.getElementById("featuredJobs").innerHTML = html;
}

loadFeaturedJobs();

/* SEARCH FUNCTION */
window.goSearch = function(value) {
  if (value.length > 2) {
    window.location.href = "jobs.html";
  }
};
</script>

</body>
</html>
