<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Work Hub PH</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2 class="logo">Remote Work Hub PH</h2>
  <nav id="navbar"></nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Find Trusted Remote Jobs in the Philippines</h1>
  <p>Work from home opportunities for Filipino freelancers</p>

  <a href="jobs.html" class="btn">Browse Jobs</a>
  <a href="post-job.html" class="btn" style="background:#28a745;">Post a Job</a>

  <br><br>

  <input
    type="text"
    placeholder="Search jobs..."
    id="searchInput"
    class="search-box-input"
  >
</section>

<!-- FEATURED JOBS -->
<section class="jobs">
  <h2 style="text-align:center;">Featured Jobs</h2>

  <div id="featuredJobs">
    <p style="text-align:center;">Loading jobs...</p>
  </div>
</section>

<footer>
  © 2026 Remote Work Hub PH
</footer>

<!-- NAVBAR SYSTEM -->
<script type="module">
import { loadNavbar } from "./navbar.js";
loadNavbar();
</script>

<!-- FIREBASE JOBS -->
<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const container = document.getElementById("featuredJobs");

async function loadJobs() {
  try {
    const snap = await getDocs(collection(db, "jobs"));

    let html = "";
    let count = 0;

    snap.forEach(doc => {
      if (count < 3) {
        const job = doc.data();

        html += `
          <div class="job-card">
            <h3>${job.title || "No title"}</h3>
            <p class="job-meta">
              <b>${job.type || ""}</b> • ${job.rate || "Negotiable"}
            </p>
            <p>${(job.description || "").substring(0, 80)}...</p>

            <a href="job.html?id=${doc.id}" class="btn">
              View Job
            </a>
          </div>
        `;

        count++;
      }
    });

    container.innerHTML = html || "<p style='text-align:center;'>No jobs yet.</p>";

  } catch (err) {
    console.error(err);
    container.innerHTML = "<p style='text-align:center;'>Failed to load jobs.</p>";
  }
}

loadJobs();

/* SEARCH */
document.getElementById("searchInput").addEventListener("keyup", (e) => {
  if (e.target.value.length > 2) {
    window.location.href = "jobs.html";
  }
});
</script>

</body>
</html>
