<!DOCTYPE html>
<html>
<head>
  <title>Job Details</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2 class="logo">WorkMarket</h2>
  <nav id="navbar"></nav>
</header>

<main class="jobs">
  <div class="job-card" id="jobBox">Loading...</div>
  <div id="applyBox"></div>
</main>

<script type="module">
import { loadNavbar } from "./navbar.js";
loadNavbar();
</script>

<script type="module">
import { db } from "./firebase.js";
import { currentUser } from "./auth.js";
import {
  doc, getDoc, addDoc, collection, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const id = new URLSearchParams(location.search).get("id");
const jobBox = document.getElementById("jobBox");
const applyBox = document.getElementById("applyBox");

let jobData;

async function loadJob() {
  const snap = await getDoc(doc(db, "jobs", id));

  jobData = snap.data();

  jobBox.innerHTML = `
    <h3>${jobData.title}</h3>
    <div class="job-meta">
      ${jobData.company || "Private"} • ${jobData.location}
    </div>
    <p>${jobData.description}</p>
  `;

  renderApply();
}

function renderApply() {

  if (!currentUser) {
    applyBox.innerHTML = `<p>Please login to apply.</p>`;
    return;
  }

  if (currentUser.role !== "freelancer") {
    applyBox.innerHTML = `<p>Only freelancers can apply.</p>`;
    return;
  }

  applyBox.innerHTML = `
    <div class="job-card">
      <h3>Apply for this Job</h3>

      <textarea id="cover" placeholder="Cover letter"
        style="width:100%; height:120px; margin-top:10px;"></textarea>

      <input id="rate" placeholder="Rate (e.g $5/hr)"
        style="width:100%; padding:10px; margin-top:10px;">

      <button class="btn" id="submit">Submit Application</button>
    </div>
  `;

  document.getElementById("submit").onclick = async () => {

    await addDoc(collection(db, "applications"), {
      jobId: id,
      jobTitle: jobData.title,
      applicantId: currentUser.uid,
      applicantName: currentUser.name,
      coverLetter: document.getElementById("cover").value,
      rate: document.getElementById("rate").value,
      status: "pending",
      createdAt: serverTimestamp()
    });

    alert("Application sent!");
  };
}

loadJob();
</script>

</body>
</html>
