<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
  </nav>
</header>

<section class="jobs">

  <div id="jobContainer">
    <p>Loading job...</p>
  </div>

</section>

<footer>
  <p>© 2026 Remote Work Hub PH</p>
</footer>

<script type="module">

import { db } from "./firebase.js";
import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* GET ID FROM URL */
const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");

const container = document.getElementById("jobContainer");

async function loadJob() {

  if (!jobId) {
    container.innerHTML = "<p>Job not found.</p>";
    return;
  }

  const snap = await getDoc(doc(db, "jobs", jobId));

  if (!snap.exists()) {
    container.innerHTML = "<p>Job does not exist.</p>";
    return;
  }

  const job = snap.data();

  container.innerHTML = `
    <div class="job-card">

      <h1>${job.title}</h1>

      <p><b>Type:</b> ${job.type}</p>
      <p><b>Rate:</b> ${job.rate}</p>

      <hr>

      <p style="margin-top:10px;">
        ${job.desc}
      </p>

      <br>

      <a href="apply.html" class="btn">Apply Now</a>

    </div>
  `;

}

loadJob();

</script>

</body>
</html>
