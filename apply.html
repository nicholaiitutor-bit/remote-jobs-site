<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply - Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>
  <nav>
  <a href="index.html">Home</a>
  <a href="jobs.html">Jobs</a>
  <a href="post-job.html">Post Job</a>
  <a href="apply.html">Apply</a>
</nav>
</header>

<section class="jobs">

  <h1>Job Application Form</h1>
  <p>Fill out the form below to apply for remote jobs</p>

  <div class="job-card">

    <form>

      <label>Full Name</label><br>
      <input type="text" placeholder="Enter your full name" style="width:100%; padding:10px; margin:8px 0;"><br>

      <label>Email</label><br>
      <input type="email" placeholder="Enter your email" style="width:100%; padding:10px; margin:8px 0;"><br>

      <label>Position Applying For</label><br>
      <input type="text" placeholder="e.g. Virtual Assistant" style="width:100%; padding:10px; margin:8px 0;"><br>

      <label>Experience</label><br>
      <textarea placeholder="Tell us about your experience" style="width:100%; padding:10px; margin:8px 0;"></textarea><br>

      <button type="button" class="btn">Submit Application</button>

    </form>

  </div>

</section>

<footer>
  <p>© 2026 Remote Work Hub PH</p>
</footer>

</body>
</html>
