<!DOCTYPE html>
<html>
<head>
  <title>Jobs - Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </nav>
</header>

<section class="jobs">
  <h2 style="text-align:center;">All Jobs</h2>
  <div id="jobList">Loading jobs...</div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAs5VqodQCgH-F-VYbM1zS2BzsoHOQGpzo",
  authDomain: "remote-work-hub-211d8.firebaseapp.com",
  projectId: "remote-work-hub-211d8"
});

const db = getFirestore(app);

const container = document.getElementById("jobList");

async function loadJobs() {
  const snap = await getDocs(collection(db, "jobs"));

  let html = "";

  snap.forEach(doc => {
    const job = doc.data();

    html += `
      <div class="job-card">
        <h3>${job.title}</h3>
        <p>${job.type || ""} • ${job.rate || ""}</p>
        <p>${(job.description || "").substring(0, 100)}...</p>
        <a href="job.html?id=${doc.id}" class="btn">View Job</a>
      </div>
    `;
  });

  container.innerHTML = html || "No jobs found.";
}

loadJobs();
</script>

</body>
</html>
