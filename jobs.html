<section class="jobs">

  <h1>Find Remote Jobs</h1>
  <p>Browse opportunities from global employers</p>

  <div id="jobList"></div>

</section>

<script>
function loadJobs() {
  let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

  let container = document.getElementById("jobList");

  let defaultJobs = `
    <div class="job-card">
      <h3>Virtual Assistant</h3>
      <p>$3 - $6/hr</p>
      <a href="apply.html" class="btn">Apply Now</a>
    </div>

    <div class="job-card">
      <h3>Graphic Designer</h3>
      <p>$150/project</p>
      <a href="apply.html" class="btn">Apply Now</a>
    </div>
  `;

  let userJobs = jobs.map(job => `
    <div class="job-card">
      <h3>${job.title}</h3>
      <p>${job.rate} | ${job.type}</p>
      <p>${job.desc}</p>
      <a href="apply.html" class="btn">Apply Now</a>
    </div>
  `).join("");

  container.innerHTML = defaultJobs + userJobs;
}

loadJobs();
</script>
