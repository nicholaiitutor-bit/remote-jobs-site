<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>

  <!-- FIXED NAV -->
  <nav id="navbar"></nav>
</header>

<section class="jobs">

  <h1>Find Remote Jobs</h1>
  <p>Browse opportunities from global employers</p>

  <!-- SEARCH -->
  <input 
    type="text" 
    placeholder="Search jobs..." 
    onkeyup="filterJobs()" 
    style="padding:10px; width:60%; border-radius:6px; border:1px solid #ccc; margin-bottom:15px;"
  >

  <!-- JOB LIST -->
  <div id="jobList">
    <p>Loading jobs...</p>
  </div>

</section>

<footer>
  <p>© 2026 Remote Work Hub PH</p>
</footer>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAs5VqodQCgH-F-VYbM1zS2BzsoHOQGpzo",
  authDomain: "remote-work-hub-211d8.firebaseapp.com",
  projectId: "remote-work-hub-211d8",
  storageBucket: "remote-work-hub-211d8.firebasestorage.app",
  messagingSenderId: "697750475671",
  appId: "1:697750475671:web:6e609411ae003e6500aad2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allJobs = [];

/* LOAD JOBS */
async function loadJobs() {

  const snapshot = await getDocs(collection(db, "jobs"));

  allJobs = [];

  snapshot.forEach(doc => {
    allJobs.push(doc.data());
  });

  renderJobs(allJobs);
}

/* RENDER JOBS */
function renderJobs(jobs) {

  const container = document.getElementById("jobList");

  if (jobs.length === 0) {
    container.innerHTML = "<p>No jobs found.</p>";
    return;
  }

  container.innerHTML = jobs.map(job => `
    <div class="job-item">
      <h3>${job.title}</h3>
      <div>${job.type} • ${job.rate}</div>
      <p>${job.desc || ""}</p>
      <a href="apply.html" class="btn">Apply</a>
    </div>
  `).join("");
}

/* SEARCH */
window.filterJobs = function () {

  const value =
    document.querySelector("input").value.toLowerCase();

  const filtered = allJobs.filter(job =>
    (job.title || "").toLowerCase().includes(value) ||
    (job.type || "").toLowerCase().includes(value) ||
    (job.desc || "").toLowerCase().includes(value)
  );

  renderJobs(filtered);
};

/* START */
loadJobs();

</script>

<!-- NAV SCRIPT (FIXED) -->
<script>

const user = JSON.parse(localStorage.getItem("currentUser"));
const navbar = document.getElementById("navbar");

if (!user) {

  navbar.innerHTML = `
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  `;

} else if (user.role === "employer") {

  navbar.innerHTML = `
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="post-job.html">Post Job</a>
    <a href="employer-dashboard.html">Dashboard</a>
    <a href="#" onclick="logout()">Logout</a>
  `;

} else {

  navbar.innerHTML = `
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="#" onclick="logout()">Logout</a>
  `;

}

function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}

</script>

</body>
</html>
