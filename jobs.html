<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>

  <nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
    <a href="post-job.html">Post Job</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="jobs">

  <h1>Find Remote Jobs</h1>
  <p>Browse opportunities from global employers</p>

  <!-- SEARCH -->
  <input 
    type="text" 
    placeholder="Search jobs..." 
    onkeyup="filterJobs()" 
    style="padding:10px; width:60%; border-radius:6px; border:1px solid #ccc; margin-bottom:15px;"
  >

  <!-- JOB LIST -->
  <div id="jobList"></div>

</section>

<footer>
  <p>© 2026 Remote Work Hub PH</p>
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyAs5VqodQCgH-F-VYbM1zS2BzsoHOQGpzo",
  authDomain: "remote-work-hub-211d8.firebaseapp.com",
  projectId: "remote-work-hub-211d8",
  storageBucket: "remote-work-hub-211d8.firebasestorage.app",
  messagingSenderId: "697750475671",
  appId: "1:697750475671:web:6e609411ae003e6500aad2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allJobs = [];

async function loadJobs() {
  const querySnapshot = await getDocs(collection(db, "jobs"));

  allJobs = [];

  querySnapshot.forEach((doc) => {
    allJobs.push(doc.data());
  });

  renderJobs(<a href="job-details.html?id=${job.title}" class="btn">View Job</a>);
}

function renderJobs(jobs) {
  let html = "";

  if (jobs.length === 0) {
    html = "<p>No jobs found.</p>";
  }

  jobs.forEach(job => {
    html += `
      <div class="job-item">
        <h3>${job.title}</h3>
        <div class="job-meta">${job.type} • ${job.rate}</div>
        <p>${job.desc}</p>
        <a href="apply.html" class="btn">Apply</a>
      </div>
    `;
  });

  document.getElementById("jobList").innerHTML = html;
}

/* SEARCH FUNCTION */
window.filterJobs = function () {
  let value = document.querySelector("input").value.toLowerCase();

  let filtered = allJobs.filter(job =>
    job.title.toLowerCase().includes(value) ||
    job.type.toLowerCase().includes(value) ||
    job.desc.toLowerCase().includes(value)
  );

  renderJobs(filtered);
};

loadJobs();
</script>

</body>
</html>
