<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Remote Work Hub PH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Remote Work Hub PH</h2>
</header>

<section class="hero">

  <h1>Create Your Account</h1>
  <p>Join as an employer or job seeker</p>

  <div class="job-card" style="max-width:400px; margin:auto;">

    <input id="name" placeholder="Full Name" style="width:100%; padding:10px; margin:5px 0;">

    <input id="email" placeholder="Email" style="width:100%; padding:10px; margin:5px 0;">

    <input id="password" type="password" placeholder="Password" style="width:100%; padding:10px; margin:5px 0;">

    <select id="role" style="width:100%; padding:10px; margin:5px 0;">
      <option value="">Select Role</option>
      <option value="employer">Employer</option>
      <option value="jobseeker">Job Seeker</option>
    </select>

    <button class="btn" onclick="signup()">Sign Up</button>

  </div>

</section>

<script>
function signup() {

  let user = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    role: document.getElementById("role").value
  };

  if (!user.name || !user.email || !user.password || !user.role) {
    alert("Please fill all fields!");
    return;
  }

  localStorage.setItem("loggedInUser", JSON.stringify(user));

  alert("Account created successfully!");

  window.location.href = "index.html";
}
</script>

</body>
</html>
